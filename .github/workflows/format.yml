name: measure cargo-hack package parallelism
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/format.yml"
jobs:
  baseline:
    name: sequential workspace powerset
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: 1
      PNA_TEST_REQUIRE: birthtime,mtime_nanos,xattr,nodump,chmod,setuid,unprivileged
      CARGO_TARGET_DIR: target-measure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libacl1-dev
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          cache: false
      - name: Install cargo-hack
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759
        with:
          crate: cargo-hack
      - name: Run workspace feature powerset
        run: cargo hack test --locked --release --feature-powerset --exclude-features wasm --exclude portable-network-archive-fuzz --exclude xtask -- --test-threads=1

  package_parallel:
    name: parallel package powersets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: 1
      PNA_TEST_REQUIRE: birthtime,mtime_nanos,xattr,nodump,chmod,setuid,unprivileged
      CARGO_TARGET_DIR: target-measure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libacl1-dev
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          cache: false
      - name: Install cargo-hack
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759
        with:
          crate: cargo-hack
      - parallel:
          - name: CLI feature powerset
            run: cargo hack test --locked --release --feature-powerset --exclude-features wasm -p portable-network-archive -- --test-threads=1
          - name: pna feature powerset
            run: cargo hack test --locked --release --feature-powerset --exclude-features wasm -p pna -- --test-threads=1
          - name: libpna feature powerset
            run: cargo hack test --locked --release --feature-powerset --exclude-features wasm -p libpna -- --test-threads=1
