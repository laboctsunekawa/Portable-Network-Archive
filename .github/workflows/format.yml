name: measure fuzz baseline
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/format.yml"
jobs:
  fuzz:
    name: baseline (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - aes_cbc
          - aes_ctr
          - aes_gcm
          - camellia_cbc
          - camellia_ctr
          - camellia_gcm
          - gcm_datastream_mutation
          - split_archive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: nightly
          cache-save-if: false
      - name: Install cargo-fuzz
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759
        with:
          crate: cargo-fuzz
      - name: Run fuzzing (${{ matrix.target }})
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: cargo fuzz run --release "$FUZZ_TARGET" -- -max_total_time=300 -timeout=25
