name: measure fuzz 2-way parallel
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/format.yml"
jobs:
  fuzz:
    name: two-way (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: crypto-a
            target1: aes_cbc
            target2: aes_ctr
          - group: crypto-b
            target1: aes_gcm
            target2: camellia_cbc
          - group: crypto-c
            target1: camellia_ctr
            target2: camellia_gcm
          - group: archive
            target1: gcm_datastream_mutation
            target2: split_archive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: nightly
          cache-save-if: false
      - name: Install cargo-fuzz
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759
        with:
          crate: cargo-fuzz
      - parallel:
          - name: Run fuzzing (${{ matrix.target1 }})
            env:
              FUZZ_TARGET: ${{ matrix.target1 }}
            run: cargo fuzz run --release "$FUZZ_TARGET" -- -max_total_time=300 -timeout=25
          - name: Run fuzzing (${{ matrix.target2 }})
            env:
              FUZZ_TARGET: ${{ matrix.target2 }}
            run: cargo fuzz run --release "$FUZZ_TARGET" -- -max_total_time=300 -timeout=25
