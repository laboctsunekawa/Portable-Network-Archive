name: Fuzzing with cargo fuzz

permissions:
  contents: read # checkout

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "pna/**"
      - "cli/**"
      - "fuzz/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/fuzz.yml"
  pull_request:
    branches:
      - main
    paths:
      - "lib/**"
      - "pna/**"
      - "cli/**"
      - "fuzz/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/fuzz.yml"

jobs:
  fuzz_target:
    name: Detect fuzz target
    runs-on: ubuntu-slim
    timeout-minutes: 60
    outputs:
      fuzz_groups: ${{ steps.fuzz_target.outputs.fuzz_groups }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: fuzz_target
        name: Detect fuzz target
        shell: bash
        run: |
          fuzz_groups="$(
            find fuzz/fuzz_targets -maxdepth 1 -name '*.rs' -exec basename {} .rs \; |
              sort |
              jq -Rsc '
                split("\n") | map(select(length > 0)) as $targets |
                [
                  range(0; $targets | length; 2) as $i |
                  {
                    target1: $targets[$i],
                    target2: ($targets[$i + 1] // "")
                  }
                ]
              '
          )"
          echo "fuzz_groups=$fuzz_groups" >> "$GITHUB_OUTPUT"

  fuzz:
    name: Run cargo fuzz (${{ matrix.target1 }}${{ matrix.target2 != '' && format(', {0}', matrix.target2) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: fuzz_target
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.fuzz_target.outputs.fuzz_groups) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: nightly
          cache-save-if: ${{ github.ref_name == github.event.repository.default_branch }}
      - name: Install cargo-fuzz
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cargo-fuzz
      - parallel:
          - name: Run fuzzing (${{ matrix.target1 }})
            env:
              FUZZ_TARGET: ${{ matrix.target1 }}
            run: |
              cargo fuzz run --release "$FUZZ_TARGET" -- -max_total_time=300 -timeout=25
          - name: Run fuzzing (${{ matrix.target2 }})
            if: ${{ matrix.target2 != '' }}
            env:
              FUZZ_TARGET: ${{ matrix.target2 }}
            run: |
              cargo fuzz run --release "$FUZZ_TARGET" -- -max_total_time=300 -timeout=25
      - name: Upload crash artifacts (${{ matrix.target1 }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target1 }}-crashes
          path: fuzz/artifacts/${{ matrix.target1 }}
          if-no-files-found: ignore
      - name: Upload crash artifacts (${{ matrix.target2 }})
        if: ${{ always() && matrix.target2 != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target2 }}-crashes
          path: fuzz/artifacts/${{ matrix.target2 }}
          if-no-files-found: ignore
