name: Fuzzing with cargo fuzz

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "ci/fuzz-parallel-4"
    paths:
      - "lib/**"
      - "pna/**"
      - "cli/**"
      - "fuzz/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/fuzz.yml"
  pull_request:
    branches:
      - main
    paths:
      - "lib/**"
      - "pna/**"
      - "cli/**"
      - "fuzz/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/fuzz.yml"

jobs:
  fuzz:
    name: Run cargo fuzz (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: crypto
            target1: aes_cbc
            target2: aes_ctr
            target3: aes_gcm
            target4: camellia_cbc
          - group: mixed
            target1: camellia_ctr
            target2: camellia_gcm
            target3: gcm_datastream_mutation
            target4: split_archive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: nightly
          cache-save-if: ${{ github.ref_name == github.event.repository.default_branch }}
      - name: Install cargo-fuzz
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759
        with:
          crate: cargo-fuzz
      - parallel:
          - name: Run fuzzing (${{ matrix.target1 }})
            env:
              FUZZ_TARGET: ${{ matrix.target1 }}
            run: cargo fuzz run --release "$FUZZ_TARGET" -- -max_total_time=300 -timeout=25
          - name: Run fuzzing (${{ matrix.target2 }})
            env:
              FUZZ_TARGET: ${{ matrix.target2 }}
            run: cargo fuzz run --release "$FUZZ_TARGET" -- -max_total_time=300 -timeout=25
          - name: Run fuzzing (${{ matrix.target3 }})
            env:
              FUZZ_TARGET: ${{ matrix.target3 }}
            run: cargo fuzz run --release "$FUZZ_TARGET" -- -max_total_time=300 -timeout=25
          - name: Run fuzzing (${{ matrix.target4 }})
            env:
              FUZZ_TARGET: ${{ matrix.target4 }}
            run: cargo fuzz run --release "$FUZZ_TARGET" -- -max_total_time=300 -timeout=25
      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0
        with:
          name: fuzz-${{ matrix.group }}-crashes
          path: fuzz/artifacts
          if-no-files-found: ignore
