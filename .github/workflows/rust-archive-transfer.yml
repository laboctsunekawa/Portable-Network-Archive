name: Temporary Rust archive transfer
on:
  push:
    branches: [chore/temporary-rust-bootstrap-chunks-20261009]
    paths: [.github/workflows/rust-archive-transfer.yml]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare Rust archive
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target wasm32-wasip1 --target wasm32-wasip2 --target wasm32-unknown-unknown
          mkdir -p output
          cp "$(readlink -f "$(command -v rustup)")" output/rustup
          root="$(rustup run stable rustc --print sysroot)"
          tar -C "$(dirname "$root")" -cf - "$(basename "$root")" | zstd -T0 -8 -o output/toolchain.tar.zst
          (cd output && sha256sum toolchain.tar.zst rustup > SHA256SUMS)
          split -b 48M -d -a 2 output/toolchain.tar.zst output/part-
          (cd output && sha256sum part-* > PART_SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: rust-checksums
          path: |
            output/SHA256SUMS
            output/PART_SHA256SUMS
            output/rustup
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: rust-part-00
          path: output/part-00
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: rust-part-01
          path: output/part-01
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: rust-part-02
          path: output/part-02
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: rust-part-03
          path: output/part-03
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: rust-part-04
          path: output/part-04
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: rust-part-05
          path: output/part-05
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: rust-part-06
          path: output/part-06
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: rust-part-07
          path: output/part-07
          if-no-files-found: ignore
          compression-level: 0
