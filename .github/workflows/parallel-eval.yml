name: parallel-eval

on:
  push:
    branches:
      - ci/parallel-measure-base
    paths:
      - .github/workflows/parallel-eval.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  ubuntu-baseline:
    name: Ubuntu baseline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PNA_TEST_REQUIRE: birthtime,mtime_nanos,xattr,nodump,chmod,setuid,unprivileged
    steps:
      - run: |
          sudo apt update
          sudo apt install -y libacl1-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          channel: stable
      - uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cargo-hack
          cache-key: ubuntu-latest
      - run: cargo fetch --locked
      - name: feature powerset baseline
        run: cargo hack test --locked --release --feature-powerset --exclude-features wasm --exclude portable-network-archive-fuzz --exclude xtask -- --test-threads=1

  ubuntu-p2-shared:
    name: Ubuntu 2 partitions / shared target
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PNA_TEST_REQUIRE: birthtime,mtime_nanos,xattr,nodump,chmod,setuid,unprivileged
    steps:
      - run: |
          sudo apt update
          sudo apt install -y libacl1-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          channel: stable
      - uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cargo-hack
          cache-key: ubuntu-latest
      - run: cargo fetch --locked
      - parallel:
          - name: partition 1/2
            run: cargo hack test --locked --release --feature-powerset --partition 1/2 --exclude-features wasm --exclude portable-network-archive-fuzz --exclude xtask -- --test-threads=1
          - name: partition 2/2
            run: cargo hack test --locked --release --feature-powerset --partition 2/2 --exclude-features wasm --exclude portable-network-archive-fuzz --exclude xtask -- --test-threads=1

  ubuntu-p2-isolated:
    name: Ubuntu 2 partitions / isolated targets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PNA_TEST_REQUIRE: birthtime,mtime_nanos,xattr,nodump,chmod,setuid,unprivileged
    steps:
      - run: |
          sudo apt update
          sudo apt install -y libacl1-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          channel: stable
      - uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cargo-hack
          cache-key: ubuntu-latest
      - run: cargo fetch --locked
      - parallel:
          - name: partition 1/2
            run: cargo hack test --locked --release --feature-powerset --partition 1/2 --exclude-features wasm --exclude portable-network-archive-fuzz --exclude xtask -- --test-threads=1
            env:
              CARGO_TARGET_DIR: target/partition-1
              CARGO_BUILD_JOBS: 2
          - name: partition 2/2
            run: cargo hack test --locked --release --feature-powerset --partition 2/2 --exclude-features wasm --exclude portable-network-archive-fuzz --exclude xtask -- --test-threads=1
            env:
              CARGO_TARGET_DIR: target/partition-2
              CARGO_BUILD_JOBS: 2

  ubuntu-p4-isolated:
